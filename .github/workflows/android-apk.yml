name: Android Standalone Test APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android

      # Expo's generated release build uses signingConfigs.debug. Replace the
      # template keystore with a fresh, valid key intended only for test installs.
      - name: Generate test signing key
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'signingConfig signingConfigs.debug' android/app/build.gradle
          rm -f android/app/debug.keystore
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore android/app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MotoGo Test, OU=Testing, O=MotoGo, C=PE"

      # Release invokes Expo's export:embed task and disables the Metro dev host.
      - name: Build standalone APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify packaged bundle, manifest and test signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p artifacts
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              bundle = apk.read("assets/index.android.bundle")
              assert len(bundle) > 0, "JavaScript bundle is empty"
              print(f"Embedded JavaScript/Hermes bundle: {len(bundle)} bytes")
              assert any(n.startswith("lib/arm64-v8a/") for n in apk.namelist()), "Missing arm64 native libraries"
          PY
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee artifacts/signature.txt
          keytool -exportcert -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey -file /tmp/motogo-test.der
          EXPECTED=$(sha256sum /tmp/motogo-test.der | cut -d ' ' -f 1)
          grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED" artifacts/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > artifacts/alignment.txt
          apkanalyzer manifest print "$APK" > artifacts/AndroidManifest.xml
          test "$(apkanalyzer manifest debuggable "$APK")" = false
          test "$(apkanalyzer manifest application-id "$APK")" = pe.motogo.chimbote
          cp "$APK" artifacts/MotoGo-android-standalone-test.apk
          (cd artifacts && sha256sum MotoGo-android-standalone-test.apk > SHA256SUMS)

      - name: Upload verified standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: MotoGo-android-standalone-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
